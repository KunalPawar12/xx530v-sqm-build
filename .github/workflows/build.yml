name: Build xx530v SQM firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget swig time xsltproc ccache

      - name: Clone exact OpenWrt source revision
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git fetch --depth 1 origin aeee87fcbf75c3b8ea027fa33b50d795c60ffbb1
          git checkout aeee87fcbf75c3b8ea027fa33b50d795c60ffbb1
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select TP-Link xx230v/xx530v v1 target and SQM packages
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_en7523=y
          CONFIG_TARGET_DEVICE_airoha_en7523_DEVICE_tplink_xx230v_v1=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-sched-fq_codel=y
          CONFIG_PACKAGE_kmod-ifb=y
          EOF
          make defconfig
          echo "--- Selected target ---"
          grep -E '^CONFIG_TARGET_(airoha|DEVICE_airoha_en7523)' .config || true
          echo "--- SQM/CAKE packages ---"
          grep -E '^CONFIG_PACKAGE_(sqm-scripts|luci-app-sqm|kmod-sched-cake|kmod-sched-fq_codel|kmod-ifb)' .config || true

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Collect firmware
        run: |
          mkdir -p artifact
          cp -a openwrt/bin/targets/airoha/en7523/. artifact/
          cp openwrt/.config artifact/build.config
          printf 'OpenWrt source commit: %s\n' "$SOURCE_COMMIT" > artifact/BUILD_INFO.txt
          printf 'Target: TP-Link xx230v/xx530v v1\n' >> artifact/BUILD_INFO.txt
          printf 'SQM: sqm-scripts + luci-app-sqm\n' >> artifact/BUILD_INFO.txt
          printf 'AQM: CAKE + fq_codel kernel modules\n' >> artifact/BUILD_INFO.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xx530v-sqm-firmware
          path: artifact/
          retention-days: 30
